spring:
  application:
    name: alpha-bot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alphabot}
    username: ${SPRING_DATASOURCE_USERNAME:alphabot}
    password: ${SPRING_DATASOURCE_PASSWORD:alphabot123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis123}

  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes default TTL

  flyway:
    enabled: true
    locations: classpath:db/migration

# LangChain4j - Groq (configured via OpenAI-compatible endpoint)
langchain4j:
  open-ai:
    chat-model:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model-name: llama3-8b-8192
      temperature: 0.1
      max-tokens: 512
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: llama3.1:8b
      temperature: 0.1

# App-specific settings
alpha-bot:
  crawler:
    interval-ms: 300000 # 5 minutes
  ai:
    provider: groq # Use 'ollama' if no API key
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  alert:
    sentiment-threshold: 0.7  # Alert when score > 0.7 (Bullish)

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
