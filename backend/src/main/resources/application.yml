spring:
  application:
    name: alpha-bot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alphabot}
    username: ${SPRING_DATASOURCE_USERNAME:alphabot}
    password: ${SPRING_DATASOURCE_PASSWORD:alphabot123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis123}

  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes default TTL

  flyway:
    enabled: true
    locations: classpath:db/migration

# App-specific settings
alpha-bot:
  crawler:
    interval-ms: 60000  # 1 minute — faster pickup for time-sensitive news
    # Vietnamese stock news sources (free, no API key needed)
    # CafeF, VnExpress kinh te, VietnamFinance, Dau tu, Thanh nien kinh te
  hose:
    disclosure-url: "https://www.hsx.vn/Modules/Listed/Web/Disclosure"
    interval-ms: 120000  # 2 minutes — official exchange announcements
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}  # Optional — leave blank to disable
    chat-id: ${TELEGRAM_CHAT_ID:}
  alert:
    sentiment-threshold: 0.6  # Alert when score >= 0.6
  manual:
    initial-capital: 100000000

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# AI Assistant Config (Groq via OpenAI compatible API)
langchain4j:
  openai:
    chat-model:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:gsk_placeholder}
      model-name: llama-3.3-70b-versatile
      temperature: 0.1
      log-requests: true
      log-responses: true
