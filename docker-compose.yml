version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alpha-bot-postgres
    environment:
      POSTGRES_DB: alphabot
      POSTGRES_USER: alphabot
      POSTGRES_PASSWORD: alphabot123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alpha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphabot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alpha-bot-redis
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alpha-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: alpha-bot-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
    ports:
      - "8001:8081"
    depends_on:
      - redis
    networks:
      - alpha-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpha-bot-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alphabot
      SPRING_DATASOURCE_USERNAME: alphabot
      SPRING_DATASOURCE_PASSWORD: alphabot123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis123
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpha-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alpha-bot-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - alpha-network

volumes:
  postgres_data:
  redis_data:

networks:
  alpha-network:
    driver: bridge
