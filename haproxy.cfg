global
    log stdout format raw local0
    maxconn 500000 # Adjusted from 1M to fit OS FD limit of 1M (2 FDs per connection)

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    # WebSocket timeouts (longer for heartbeat)
    timeout tunnel 3600s 

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

frontend http-in
    bind *:8080
    default_backend nodes

backend nodes
    balance roundrobin
    # Sticky sessions based on Cookie (required for some WS implementations, although STOMP is stateless)
    # cookie SERVERID insert indirect nocache
    
    # Check if backend is alive
    option httpchk GET /actuator/health
    
    # Define our 3 backend replicas (Docker DNS resolution for 'backend' will return all IPs)
    server-template be- 3 backend:8080 check init-addr libc,none
